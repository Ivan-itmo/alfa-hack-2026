<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1850 820" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 26px; font-weight: bold; fill: #ffffff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .box { rx: 12px; ry: 12px; stroke-width: 2px; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #cbd5e1; }
      .section-box { rx: 16px; ry: 16px; fill: #131b2e; stroke: #1e293b; stroke-width: 1.5px; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; letter-spacing: 1px; }
      path { fill: none !important; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF3124"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Фон -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Шапка -->
  <rect x="30" y="25" width="6" height="42" fill="#EF3124" rx="3" />
  <text x="50" y="48" class="title">Alfa Biz Credit AI — Finite State Machine (12 состояний заявки)</text>
  <text x="50" y="68" class="subtitle">Полный жизненный цикл кредитования малого бизнеса • Архитектура XAI и соответствие нормам Банка России</text>

  <!-- Зоны контуров -->
  <rect x="30" y="90" width="480" height="700" class="section-box" />
  <text x="50" y="120" class="section-title" fill="#EF3124">КЛИЕНТСКИЙ КОНТУР И КАЛЬКУЛЯТОР</text>

  <rect x="540" y="90" width="530" height="700" class="section-box" />
  <text x="560" y="120" class="section-title" fill="#60a5fa">АВТОМАТИЧЕСКИЙ AI-СКОРИНГ</text>

  <rect x="1100" y="90" width="720" height="700" class="section-box" />
  <text x="1120" y="120" class="section-title" fill="#34d399">АНДЕРРАЙТИНГ, РЕШЕНИЕ И ВЫДАЧА</text>

  <!-- Контур 1 -->
  <rect x="60" y="160" width="180" height="65" class="box" fill="#1e293b" stroke="#475569" />
  <text x="80" y="188" class="box-title" fill="#f8fafc">ЭКРАН ВХОДА</text>
  <text x="80" y="208" class="box-desc" fill="#94a3b8">Выбор сценария доступа</text>

  <rect x="60" y="270" width="180" height="65" class="box" fill="#2d1519" stroke="#EF3124" />
  <text x="80" y="298" class="box-title" fill="#fca5a5">ДЕМО-ВХОД В 1 КЛИК</text>
  <text x="80" y="318" class="box-desc" fill="#f87171">client1 / client2 / client3</text>

  <rect x="290" y="160" width="200" height="75" class="box" fill="#1e293b" stroke="#cbd5e1" />
  <text x="310" y="190" class="box-title" fill="#ffffff">ГЛАВНЫЙ ДАШБОРД</text>
  <text x="310" y="212" class="box-desc" fill="#94a3b8">32 статьи, профиль компании</text>

  <rect x="290" y="270" width="200" height="65" class="box" fill="#1e293b" stroke="#475569" />
  <text x="310" y="298" class="box-title" fill="#f8fafc">КАЛЬКУЛЯТОР DSTI</text>
  <text x="310" y="318" class="box-desc" fill="#94a3b8">Оценка платежа и шансов</text>

  <!-- Контур 2 -->
  <rect x="570" y="160" width="190" height="65" class="box" fill="#1e293b" stroke="#64748b" />
  <text x="590" y="188" class="box-title" fill="#f8fafc">1. DRAFT</text>
  <text x="590" y="208" class="box-desc" fill="#94a3b8">Параметры и цель кредита</text>

  <rect x="570" y="270" width="190" height="65" class="box" fill="#1e293b" stroke="#64748b" />
  <text x="590" y="298" class="box-title" fill="#f8fafc">2. DATA_ENRICHMENT</text>
  <text x="590" y="318" class="box-desc" fill="#94a3b8">Моки ФНС и выписки БКИ</text>

  <rect x="810" y="250" width="230" height="105" class="box" fill="#2d1519" stroke="#EF3124" />
  <circle cx="830" cy="275" r="5" fill="#EF3124" />
  <text x="845" y="280" class="box-title" fill="#fca5a5">3. SCORING_IN_PROGRESS</text>
  <text x="830" y="304" class="box-desc" fill="#e2e8f0">• Математика DSTI (по ЦБ)</text>
  <text x="830" y="322" class="box-desc" fill="#e2e8f0">• XAI Gemma 4 12B (Explainable)</text>
  <text x="830" y="340" class="box-desc" fill="#e2e8f0">• Анализ 5 веток исходов</text>

  <!-- Контур 3: Ветки скоринга -->
  <rect x="1130" y="140" width="190" height="65" class="box" fill="#1e3a2f" stroke="#10b981" />
  <text x="1145" y="168" class="box-title" fill="#6ee7b7">4. APPROVED ★</text>
  <text x="1145" y="188" class="box-desc" fill="#a7f3d0">DSTI ≤ 35%, скоринг ≥ 650</text>

  <rect x="1130" y="240" width="190" height="65" class="box" fill="#3b2d18" stroke="#f59e0b" />
  <text x="1145" y="268" class="box-title" fill="#fde68a">5. COUNTER_OFFER</text>
  <text x="1145" y="288" class="box-desc" fill="#fef3c7">Безопасный лимит (DSTI 35%)</text>

  <rect x="1130" y="340" width="190" height="65" class="box" fill="#172554" stroke="#3b82f6" />
  <text x="1145" y="368" class="box-title" fill="#93c5fd">6. DOCS_REQUIRED</text>
  <text x="1145" y="388" class="box-desc" fill="#bfdbfe">Возраст &lt; 6 мес (Стартап)</text>

  <rect x="1130" y="440" width="190" height="55" class="box" fill="#1e293b" stroke="#3b82f6" />
  <text x="1145" y="465" class="box-title" fill="#93c5fd">7. DOCS_UPLOADED</text>
  <text x="1145" y="483" class="box-desc" fill="#94a3b8">Файлы прикреплены в БД</text>

  <rect x="1130" y="530" width="190" height="65" class="box" fill="#2e1065" stroke="#8b5cf6" />
  <text x="1145" y="558" class="box-title" fill="#c4b5fd">8. MANUAL_REVIEW</text>
  <text x="1145" y="578" class="box-desc" fill="#ddd6fe">Досье кредитного офицера</text>

  <rect x="1130" y="640" width="190" height="65" class="box" fill="#3f1218" stroke="#ef4444" />
  <text x="1145" y="668" class="box-title" fill="#fca5a5">9. REJECTED ✕</text>
  <text x="1145" y="688" class="box-desc" fill="#fecaca">Банкротство / Стоп-факторы</text>

  <!-- Колонка 2 (Подписание и Отмена) -->
  <rect x="1360" y="140" width="190" height="65" class="box" fill="#1e293b" stroke="#f1f5f9" />
  <text x="1375" y="168" class="box-title" fill="#ffffff">10. PENDING_SIGN</text>
  <text x="1375" y="188" class="box-desc" fill="#cbd5e1">Код ПЭП: 1234 (без SMS)</text>

  <rect x="1360" y="240" width="190" height="65" class="box" fill="#1e293b" stroke="#64748b" />
  <text x="1375" y="268" class="box-title" fill="#f8fafc">12. CANCELLED</text>
  <text x="1375" y="288" class="box-desc" fill="#94a3b8">Отказ клиента от условий</text>

  <!-- Колонка 3: ФИНАЛ ВЫДАЧИ (Смещен правее) -->
  <rect x="1590" y="135" width="205" height="75" class="box" fill="#1e3a2f" stroke="#10b981" stroke-width="3" />
  <text x="1605" y="165" class="box-title" fill="#34d399">11. ISSUED ★</text>
  <text x="1605" y="188" class="box-desc" fill="#6ee7b7">Кредит выдан!</text>
  <text x="1605" y="202" class="box-desc" fill="#a7f3d0">Баланс пополнен мгновенно</text>

  <!-- СВЯЗИ И СТРЕЛКИ -->
  <!-- Вход -> Дашборд -->
  <path d="M 150 225 L 150 270" stroke="#EF3124" stroke-width="2" marker-end="url(#arr-red)" />
  <path d="M 240 192.5 L 290 192.5" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-gray)" />
  <path d="M 240 302.5 L 265 302.5 L 265 215 L 290 215" stroke="#EF3124" stroke-width="2" marker-end="url(#arr-red)" />
  <path d="M 390 235 L 390 270" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)" />

  <!-- Дашборд -> Заявка -> Скоринг -->
  <path d="M 490 192.5 L 570 192.5" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr-gray)" />
  <text x="500" y="185" class="edge-label">Подать</text>
  <path d="M 490 302.5 L 530 302.5 L 530 210 L 570 210" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)" />
  <path d="M 665 225 L 665 270" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)" />
  <path d="M 760 302.5 L 810 302.5" stroke="#EF3124" stroke-width="2" marker-end="url(#arr-red)" />
  <text x="765" y="295" class="edge-label" fill="#EF3124">POST /submit</text>

  <!-- СТРОГО ОРТОГОНАЛЬНЫЕ СТРЕЛКИ ИЗ 3. SCORING_IN_PROGRESS (90 ГРАДУСОВ) -->
  <!-- Ветка 1: В Approved (внешняя шина x=1085) -->
  <path d="M 1040 270 L 1085 270 L 1085 172.5 L 1130 172.5" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="1048" y="162" class="edge-label" fill="#10b981">DSTI ≤ 35%</text>

  <!-- Ветка 2: В Counter Offer (внутренняя шина x=1065) -->
  <path d="M 1040 290 L 1065 290 L 1065 272.5 L 1130 272.5" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)" />
  <text x="1045" y="262" class="edge-label" fill="#f59e0b">DSTI > 55%</text>

  <!-- Ветка 3: В Docs Required (внутренняя шина x=1065) -->
  <path d="M 1040 315 L 1065 315 L 1065 372.5 L 1130 372.5" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)" />
  <text x="1048" y="362" class="edge-label" fill="#3b82f6">&lt; 6 мес</text>

  <!-- Ветка 4: В Rejected (внешняя шина x=1085) -->
  <path d="M 1040 335 L 1085 335 L 1085 672.5 L 1130 672.5" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)" />
  <text x="1045" y="520" class="edge-label" fill="#ef4444">Стоп-факторы</text>

  <!-- Документы и ручной андеррайтинг -->
  <path d="M 1225 405 L 1225 440" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)" />
  <path d="M 1225 495 L 1225 530" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr-purple)" />
  <path d="M 1320 562.5 L 1345 562.5 L 1345 190 L 1320 190" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="1350" y="380" class="edge-label" fill="#10b981">Одобрено</text>
  <path d="M 1225 595 L 1225 640" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)" />

  <!-- Counter-Offer ветки -->
  <path d="M 1225 240 L 1225 205" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="1232" y="225" class="edge-label" fill="#10b981">Принять</text>
  <path d="M 1320 272.5 L 1360 272.5" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)" />
  <text x="1322" y="265" class="edge-label">Отказ</text>

  <!-- ЗОЛОТОЙ ПУТЬ ПОДПИСАНИЯ И ВЫДАЧИ (СТРОГО НАПРАВО) -->
  <path d="M 1320 172.5 L 1360 172.5" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)" />
  <text x="1322" y="165" class="edge-label" fill="#10b981">Договор</text>

  <path d="M 1550 172.5 L 1590 172.5" stroke="#10b981" stroke-width="3" marker-end="url(#arr-green)" />
  <text x="1552" y="165" class="edge-label" fill="#34d399">ПЭП 1234</text>

  <!-- Отмена из экрана подписания -->
  <path d="M 1455 205 L 1455 240" stroke="#64748b" stroke-width="2" marker-end="url(#arr-gray)" />
  <text x="1460" y="225" class="edge-label">Передумал</text>
</svg>